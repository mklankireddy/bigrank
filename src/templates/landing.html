<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BigRank — Live Open-Source Rankings</title>
<meta name="description" content="Data-driven rankings of open-source projects, updated daily from public APIs: GitHub, Hacker News, Reddit, and marketplace installs.">
<style>
  :root {
    --bg: #0b0e14; --panel: #12161f; --panel2: #181d29; --border: #232a3a;
    --text: #d7dce6; --muted: #8b93a7; --accent: #6ea8fe; --green: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 48px 24px 60px; }

  .nav {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    min-height: 46px; padding: 0 20px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .brand a { font-weight: 800; font-size: 15px; letter-spacing: .3px; color: var(--text); text-decoration: none; }
  .brand span { color: var(--accent); }
  .groups { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .group { position: relative; }
  .gbtn {
    appearance: none; background: transparent; border: 1px solid transparent;
    color: var(--muted); font: 600 13px/1 inherit; padding: 8px 12px; border-radius: 8px; cursor: pointer;
  }
  .gbtn .caret { font-size: 10px; margin-left: 3px; }
  .group:hover .gbtn, .group:focus-within .gbtn { color: var(--text); background: var(--panel2); border-color: var(--border); }
  .menu.mega {
    display: none; position: absolute; top: 100%; right: 0; min-width: 300px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px; box-shadow: 0 12px 32px rgba(0,0,0,.5); z-index: 30; flex-wrap: wrap;
  }
  .group:hover .menu.mega, .group:focus-within .menu.mega { display: flex; }
  .menu-col { min-width: 150px; flex: 1; }
  .menu-head { font-size: 10.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); padding: 4px 10px 6px; }
  .menu a.item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 7px; color: var(--muted);
    text-decoration: none; font-size: 13.5px; font-weight: 600;
  }
  .menu a.item .i { font-size: 15px; width: 20px; text-align: center; flex: none; }
  .menu a.item:hover { color: var(--text); background: var(--panel2); }
  .menu a.item.on { color: var(--text); background: var(--panel2); border: 1px solid var(--border); }
  .menu a.item.disabled { opacity: .45; cursor: not-allowed; }
  .menu .nsoon { font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; margin-left: auto; }

  .hero { padding: 26px 0 4px; }
  h1 { font-size: 34px; margin: 0 0 8px; }
  h1 .live { color: var(--green); font-size: 13px; vertical-align: 5px; letter-spacing: .5px; }
  p.lede { color: var(--muted); font-size: 16px; margin: 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 18px; margin-top: 34px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
  .card-head { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); }
  .card-head .che { font-size: 20px; }
  .card-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 1px solid transparent; border-radius: 10px; color: var(--text); text-decoration: none; }
  .card-item .iemoji { font-size: 20px; width: 26px; text-align: center; flex: none; }
  .card-item .itext { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .card-item .iname { font-weight: 700; font-size: 14px; }
  .card-item .idesc { color: var(--muted); font-size: 12.5px; }
  .card-item .iarrow { color: var(--muted); flex: none; }
  a.card-item:hover { background: var(--panel2); border-color: var(--border); }
  a.card-item:hover .iarrow { color: var(--accent); }
  .card-item.disabled { opacity: .5; cursor: not-allowed; }
  .card-item .soon { font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; margin-left: auto; flex: none; }
  .site-footer { color: var(--muted); font-size: 12px; margin-top: 42px; padding-top: 12px; border-top: 1px solid var(--border); }
  .site-footer .sha { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
{{NAV}}

<div class="wrap">
  <div class="hero">
    <h1>Big<span style="color:var(--accent)">Rank</span> <span class="live">● LIVE</span></h1>
    <p class="lede">Data-driven rankings of AI projects, updated daily.</p>
  </div>

  <div class="cards">
    {{CARDS}}
  </div>

  <footer class="site-footer">BigRank v{{VERSION}}<span id="footerCommit"></span></footer>
</div>

<script>
(function () {
  const c = "{{COMMIT}}";
  const el = document.getElementById("footerCommit");
  if (c) el.innerHTML = ' · commit <span class="sha">' + c + "</span>";
  else el.remove();
})();
</script>
</body>
</html>
