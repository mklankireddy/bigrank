name: Tool ranking request
description: Request a new tool to be added to the BigRank rankings
title: "[Tool request] <tool name>"
labels: ["tool-request"]
body:
  - type: input
    id: title
    attributes:
      label: Title
      description: The name of the tool to rank.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What needs to be ranked and how
      description: Describe what the tool is and how you'd like it ranked (e.g. usage signals like installs, GitHub activity, mentions).
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Official link
      description: Homepage or repository URL of the tool.
    validations:
      required: true
